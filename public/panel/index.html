<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=256, height=512, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Desafio da Energia - Painel LED</title>
    <link rel="stylesheet" href="/panel/style.css" />
  </head>
  <body>
    <main class="panel-stage" aria-label="Desafio da Energia - Painel LED">
      <div class="charger-canvas">
        <img class="charger-art" src="/assets/ev-charger.png" alt="Carregador de veículo elétrico" />
        <section class="device-display" aria-live="polite">
          <div id="idle" class="display-state">
            <img class="qr-code" src="/api/qrcode" alt="QR Code para participar" />
            <p>ESCANEIE<br />PARA JOGAR</p>
          </div>
          <div id="playing" class="display-state hidden">
            <div class="game-heading">
              <p class="display-label">CARREGANDO</p>
              <strong id="seconds" class="display-timer">15</strong>
              <span class="timer-unit">segundos</span>
            </div>
            <div class="battery-icon">
              <div id="battery-fill" class="battery-fill"></div>
              <strong id="percentage" class="display-percent">0%</strong>
            </div>
            <strong id="overage" class="overage hidden">+0 ACIMA DE 100</strong>
            <p id="player-name" class="display-player">—</p>
          </div>
          <div id="result" class="display-state hidden">
            <p class="display-label">PARABÉNS!</p>
            <p id="result-player" class="result-player">—</p>
            <p class="result-label">ENERGIA FINAL</p>
            <div class="battery-icon result-battery">
              <div id="result-battery-fill" class="battery-fill"></div>
              <strong id="result-percent" class="result-percent">0%</strong>
            </div>
            <p id="result-prize" class="result-prize"></p>
            <p class="result-instruction">RETIRE SEU BRINDE<br />COM NOSSA EQUIPE</p>
          </div>
        </section>
      </div>
      <aside class="ranking-panel" aria-label="Ranking dos cinco melhores jogadores">
        <p class="ranking-title">TOP 5</p>
        <ol id="ranking-list" class="ranking-list">
          <li class="ranking-empty">AGUARDANDO JOGADORES</li>
        </ol>
      </aside>
    </main>
    <script>
      function fitPanel() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('scale') === 'none' || params.get('fixed') === 'true') {
          document.documentElement.style.setProperty('--panel-scale', '1');
          return;
        }
        const w = window.innerWidth;
        const h = window.innerHeight;
        if (!w || !h) return;
        const scale = Math.min(w / 256, h / 512);
        document.documentElement.style.setProperty('--panel-scale', String(scale));
      }
      window.addEventListener('resize', fitPanel);
      fitPanel();
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/screen/app.js"></script>
  </body>
</html>
